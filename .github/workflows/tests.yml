name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel any in-progress run for the same branch/PR — prevents stacked runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: read-only token. No write access needed for tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        # 3.12 excluded: tropycal>=1.4 _version.py uses pkg_resources which
        # is not bundled in 3.12+. Re-add when tropycal ships a fix.
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        python test_ace_tracker.py

    - name: Check code syntax
      run: |
        python -m py_compile ace_tracker.py
