name: Publish Dashboard

on:
  # Runs every 3 hours during hurricane season
  # Eastern Pacific: May 15 – Nov 30 | Atlantic: Jun 1 – Nov 30
  # Date-gating is handled inside the job steps, not here, so the
  # workflow can also be triggered manually year-round for testing.
  schedule:
    - cron: '0 0,3,6,9,12,15,18,21 * * *'

  # Manual trigger for testing outside of season
  workflow_dispatch:

# Cancel any in-progress publish run — only latest data matters
concurrency:
  group: publish
  cancel-in-progress: true

# Scoped permissions: deploy to GitHub Pages via official actions
permissions:
  pages: write      # needed for GitHub Pages deployment
  id-token: write   # needed for OIDC token (GitHub Pages)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Check if within hurricane season
      id: season_check
      run: |
        MONTH=$(date +%-m)
        DAY=$(date +%-d)
        # Eastern Pacific: May 15 (5/15) through November 30 (11/30)
        # Atlantic:        June 1  (6/1)  through November 30 (11/30)
        IN_SEASON=false
        if [ "$MONTH" -gt 5 ] && [ "$MONTH" -lt 12 ]; then
          IN_SEASON=true
        elif [ "$MONTH" -eq 5 ] && [ "$DAY" -ge 15 ]; then
          IN_SEASON=true
        fi
        echo "in_season=$IN_SEASON" >> $GITHUB_OUTPUT
        if [ "$IN_SEASON" = "false" ]; then
          echo "Outside hurricane season — skipping realtime fetch."
        fi

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Restore landfall cache
      uses: actions/cache@v6
      with:
        path: landfall_cache.json
        key: landfall-v1-${{ github.run_id }}
        restore-keys: landfall-v1-

    - name: Generate dashboard
      env:
        IN_SEASON: ${{ steps.season_check.outputs.in_season }}
        # Discord webhooks stored as repo secrets — added when Discord feature is built
        # DISCORD_WEBHOOK_ATLANTIC: ${{ secrets.DISCORD_WEBHOOK_ATLANTIC }}
        # DISCORD_WEBHOOK_PACIFIC: ${{ secrets.DISCORD_WEBHOOK_PACIFIC }}
      run: |
        python ace_tracker.py

    - name: Prepare for deployment
      run: |
        cp data/ACE_Dashboard.html data/index.html
        cp CNAME data/CNAME
        cp robots.txt data/robots.txt
        cp sitemap.xml data/sitemap.xml
        cp ace.png data/ace.png
        cp ace_preview.png data/ace_preview.png

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./data

    # actions/deploy-pages occasionally hits transient 5xx errors from the
    # Pages backend (e.g. "503 ... is githubstatus.com reporting a Pages
    # outage?"). Retry a couple of times with a short backoff before giving up.
    - name: Deploy to GitHub Pages
      id: deploy_attempt_1
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: Wait before retry
      if: steps.deploy_attempt_1.outcome == 'failure'
      run: sleep 30

    - name: Deploy to GitHub Pages (retry 1)
      id: deploy_attempt_2
      if: steps.deploy_attempt_1.outcome == 'failure'
      uses: actions/deploy-pages@v5
      continue-on-error: true

    - name: Wait before final retry
      if: steps.deploy_attempt_2.outcome == 'failure'
      run: sleep 60

    - name: Deploy to GitHub Pages (retry 2)
      if: steps.deploy_attempt_2.outcome == 'failure'
      uses: actions/deploy-pages@v5
